<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooftop Swing</title>
    <meta
      name="description"
      content="A 2D web-swinging game: shoot a rope from your hands to a rooftop and swing across the city without touching the ground."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Rooftop Swing</h1>
      <div id="game">
        <canvas id="stage"></canvas>
        <div id="hud">
          <span id="distance">0 m</span>
          <span id="best">best 0 m</span>
        </div>
        <div id="game-over" hidden>
          <p class="game-over-title">Game over</p>
          <p id="final-score">0 m</p>
          <p id="best-score">best 0 m</p>
          <button id="restart" type="button">Restart</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
